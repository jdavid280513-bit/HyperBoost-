name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Descomprimir proyecto
        run: unzip -q HyperBoost.zip
      - name: Compilar APK
        working-directory: HyperBoost
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HyperBoost-APK
          path: HyperBoost/app/build/outputs/apk/release/*.apk
